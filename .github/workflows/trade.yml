name: Trade

on:
  schedule:
    # Every hour from 07:17 to 13:17 UTC on weekdays: 08:17 to 14:17 London time in summer,
    # 07:17 to 13:17 in winter (the LSE is open 08:00 to 16:30 London time). GitHub has started
    # scheduled runs up to 6 hours late, so the slots start early: the first one that lands while
    # the market is open trades, and the later ones see that and do nothing.
    # Odd minute on purpose: the top of the hour is when GitHub's scheduler is busiest.
    - cron: "17 7-13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Work out the trades but don't send them"
        type: boolean
        default: true
      reset_halt:
        description: "Clear the circuit breaker (the drawdown baseline restarts)"
        type: boolean
        default: false
      check_tickers:
        description: "Only check the Yahoo to Trading 212 ticker mapping"
        type: boolean
        default: false
      sell_other_holdings:
        description: "Also sell everything outside the bot's 15 ETFs (one-off, to take over from an old bot)"
        type: boolean
        default: false

permissions:
  contents: write          # to commit the bot's state file back

concurrency:
  group: trade             # never two runs at once
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
      T212_ENV: ${{ vars.T212_ENV || 'demo' }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      RESET_HALT: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_halt || false }}
      SELL_OTHER_HOLDINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.sell_other_holdings || false }}
      SCHEDULED: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # branch tip, so a queued backup sees the state an earlier run saved
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check ticker mapping
        if: github.event_name == 'workflow_dispatch' && inputs.check_tickers
        run: python live.py --map

      - name: Run the bot
        if: github.event_name != 'workflow_dispatch' || !inputs.check_tickers
        run: python live.py

      - name: Save state
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.check_tickers)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "bot state $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
